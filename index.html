<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c62828">
<title>Daily Messages</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <div class="login-header">
      <img src="assets/logo.png" alt="Logo" class="login-logo">
      <h2>Daily Messages</h2>
      <p class="subtitle">Login to your account</p>
    </div>
    <div class="login-form">
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input id="usernameInput" type="text" placeholder="Username" autocomplete="username">
      </div>
      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password">
      </div>
      <div id="loginError" class="error-msg"></div>
      <button onclick="handleLogin()" class="btn-primary">Login →</button>
    </div>
    <div class="login-footer">
      <span>Powered by</span>
      <a href="http://pcmcdiary.com" target="_blank" rel="noopener">pcmcdiary.com</a>
    </div>
  </div>
</div>

<!-- ================= MAIN APP ================= -->
<div id="appScreen" class="app hidden">

  <header class="app-header">
    <div class="brand">
      <img src="assets/logo.png" alt="Logo" class="brand-logo">
      <span class="brand-name">Daily Messages</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleDetailsForm()" aria-label="Details">🏢</button>
      <button class="icon-btn" onclick="logout()" aria-label="Logout">⎋</button>
    </div>
  </header>

  <div class="controls-sticky">
    <div class="segmented">
      <button data-lang="en" class="active" onclick="setLang('en')">English</button>
      <button data-lang="hi" onclick="setLang('hi')">हिन्दी</button>
      <button data-lang="mr" onclick="setLang('mr')">मराठी</button>
    </div>
    <div class="chips-wrap">
      <button data-cat="all" class="active" onclick="setCategory('all')">All</button>
      <button data-cat="business" onclick="setCategory('business')">💼 Business</button>
      <button data-cat="maharashtra" onclick="setCategory('maharashtra')">🚩 Maharashtra</button>
      <button data-cat="festival" onclick="setCategory('festival')">🎉 Festivals</button>
      <button data-cat="saint" onclick="setCategory('saint')">🙏 Saints</button>
      <button data-cat="maharaj" onclick="setCategory('maharaj')">👑 Maharaj</button>
      <button data-cat="world" onclick="setCategory('world')">🌏 World Days</button>
    </div>
  </div>

  <div class="container">
    <div id="detailsForm" class="details-form hidden">
      <div class="details-header">
        <h3>🏢 Business Details</h3>
        <button class="close-btn" onclick="toggleDetailsForm()">✕</button>
      </div>
      <p class="hint">Added to every message you copy.</p>
      <input id="bizName" placeholder="Business Name">
      <input id="bizPhone" placeholder="Phone Number">
      <input id="bizWebsite" placeholder="Website">
      <input id="bizAddress" placeholder="Address">
      <input id="bizMapLink" placeholder="Google Review / Map Link" inputmode="url">
      <button onclick="saveDetails()" class="btn-primary">💾 Save Details</button>
    </div>
    <div id="messageList"></div>
  </div>
</div>

<script src="data/credentials.js"></script>
<script src="data/messages-data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
