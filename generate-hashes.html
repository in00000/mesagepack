<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Generate Hashed Credentials</title>
<style>body{font-family:sans-serif;padding:20px;max-width:800px;margin:auto}
textarea,input{width:100%;padding:8px;margin:6px 0;font-family:monospace;font-size:14px}
button{padding:10px 20px;background:#25d366;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
pre{background:#f4f4f4;padding:12px;border-radius:6px;overflow:auto;font-size:13px;line-height:1.4}</style>
</head>
<body>
<h1>🔐 Convert Passwords to Hashes</h1>
<p>Paste credentials — one per line, format: <code>USERNAME:PASSWORD</code></p>
<textarea id="input" rows="22">PD45981:Kx7mQ9pL!2
PD45982:Rn4#hT8wB$6
PD45983:Qn9%vZ3kJ&7
PD45984:Fb2@wM6yD^5
PD45985:Hj8!sK4nR*3
PD45986:Lp3$mT7vX%9
PD45987:Cw6&nY2qF#4
PD45988:Tz5@jR9bG!8
PD45989:Mv2#pL6xK$1
PD45990:Bq8%wN3cH&5
PD45991:Xr4!kZ7mQ*2
PD45992:Dn9@pV3tJ#6
PD45993:Gy6$hW2nL%8
PD45994:Ks3&mB9xR!1
PD45995:Pw7@fN4jT$5

PD45998:Rx4$gP7bT&2
PD45999:Fm6@kN2vX#9
PD46000:Ch3%jL8qW!4</textarea>
<br>
<button onclick="convertAll()">⚡ Convert to Hashes</button>
<p style="color:#a00;font-size:13px"><b>Wait ~15 seconds</b></p>
<pre id="out">Output will appear here...</pre>
<script>
async function pbkdf2(password, saltHex, iterations = 300000, length = 32) {
  const enc = new TextEncoder();
  const salt = hexToBytes(saltHex);
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations, hash: 'SHA-256' }, keyMaterial, length * 8);
  return bytesToHex(new Uint8Array(bits));
}
function hexToBytes(hex) { const arr = new Uint8Array(hex.length / 2); for (let i = 0; i < hex.length; i += 2) arr[i/2] = parseInt(hex.substr(i, 2), 16); return arr; }
function bytesToHex(bytes) { return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(''); }
function randomSalt() { return bytesToHex(crypto.getRandomValues(new Uint8Array(16))); }
async function convertAll() {
  const lines = document.getElementById('input').value.split('\n').map(l => l.trim()).filter(Boolean);
  const out = document.getElementById('out');
  out.textContent = 'Processing...';
  const results = [];
  for (const line of lines) {
    const [u, p] = line.split(':');
    if (!u || !p) continue;
    const salt = randomSalt();
    const hash = await pbkdf2(p, salt);
    results.push(`  { u: "${u}", s: "${salt}", h: "${hash}" }`);
  }
  out.textContent = 'const USERS = [\n' + results.join(',\n') + '\n];';
}
</script>
</body>
</html>
