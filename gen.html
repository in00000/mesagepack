const bx=b=>Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');
const rs=()=>bx(crypto.getRandomValues(new Uint8Array(16)));
async function ph(p,s){const e=new TextEncoder();const k=await crypto.subtle.importKey('raw',e.encode(p),{name:'PBKDF2'},false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:hx(s),iterations:300000,hash:'SHA-256'},k,256);return bx(new Uint8Array(b))}
